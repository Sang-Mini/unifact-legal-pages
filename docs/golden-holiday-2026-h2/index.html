<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>황금연휴 찾기 법적 문서</title>
    <meta
      name="description"
      content="황금연휴 찾기 서비스의 개인정보 처리방침, 고객지원, 이용약관, 법적 고지 페이지입니다."
    />
    <style>
      :root {
        color-scheme: light;
        --background: #f7f8fa;
        --surface: #ffffff;
        --text-primary: #191f28;
        --text-secondary: #4e5968;
        --text-muted: #8b95a1;
        --border: #e5e8eb;
        --accent: #3182f6;
        --accent-bg: #e8f3ff;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: var(--background);
        color: var(--text-primary);
        font-family:
          -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard",
          "Segoe UI", sans-serif;
        line-height: 1.68;
        word-break: keep-all;
      }

      main {
        width: min(100%, 860px);
        margin: 0 auto;
        padding: 48px 20px 72px;
      }

      article {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 24px;
        padding: 44px 40px;
        box-shadow: 0 16px 40px rgba(25, 31, 40, 0.08);
      }

      header {
        margin-bottom: 32px;
        padding-bottom: 28px;
        border-bottom: 1px solid var(--border);
      }

      nav {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-bottom: 30px;
      }

      nav a,
      .link-card {
        color: var(--accent);
        text-decoration: none;
      }

      nav a {
        display: inline-flex;
        padding: 8px 12px;
        border-radius: 999px;
        background: var(--accent-bg);
        font-size: 14px;
        font-weight: 600;
      }

      h1 {
        margin: 0 0 10px;
        font-size: 32px;
        font-weight: 700;
        letter-spacing: -0.02em;
        line-height: 1.28;
      }

      .lead {
        margin: 0;
        color: var(--text-secondary);
        font-size: 17px;
      }

      .updated-at {
        margin: 10px 0 0;
        color: var(--text-muted);
        font-size: 14px;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 14px;
      }

      .link-card {
        display: block;
        min-height: 128px;
        padding: 22px;
        border: 1px solid var(--border);
        border-radius: 18px;
        background: #fbfcfd;
      }

      .link-card strong {
        display: block;
        margin-bottom: 8px;
        color: var(--text-primary);
        font-size: 18px;
      }

      .link-card span {
        color: var(--text-secondary);
        font-size: 15px;
      }

      section {
        margin-top: 32px;
      }

      h2 {
        margin: 0 0 12px;
        font-size: 20px;
        font-weight: 700;
      }

      p {
        margin: 0;
        color: var(--text-secondary);
        font-size: 16px;
      }

      a {
        color: var(--accent);
      }

      @media (max-width: 640px) {
        main {
          padding: 24px 14px 48px;
        }

        article {
          border-radius: 20px;
          padding: 30px 22px;
        }

        h1 {
          font-size: 26px;
        }

        .grid {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <article>
        <nav aria-label="법적 문서 내비게이션">
          <a href="./privacy.html">개인정보 처리방침</a>
          <a href="./support.html">고객지원</a>
          <a href="./terms.html">이용약관</a>
          <a href="./legal.html">법적 고지</a>
        </nav>

        <header>
          <h1>황금연휴 찾기</h1>
          <p class="lead">
            2026년 하반기 공휴일과 보유 연차를 조합해 최대 연속 휴무를
            안내하는 앱인토스 미니앱입니다.
          </p>
          <p class="updated-at">문서 시행일: 2026년 7월 6일</p>
        </header>

        <div class="grid">
          <a class="link-card" href="./privacy.html">
            <strong>개인정보 처리방침</strong>
            <span>수집 정보, 저장 위치, 외부 전송 여부를 확인할 수 있어요.</span>
          </a>
          <a class="link-card" href="./support.html">
            <strong>고객지원</strong>
            <span>문의 방법과 자주 묻는 질문을 확인할 수 있어요.</span>
          </a>
          <a class="link-card" href="./terms.html">
            <strong>서비스 이용약관</strong>
            <span>서비스 이용 조건과 책임 범위를 안내해요.</span>
          </a>
          <a class="link-card" href="./legal.html">
            <strong>법적 고지</strong>
            <span>공휴일 정보와 추천 결과의 한계를 안내해요.</span>
          </a>
        </div>

        <section>
          <h2>문의</h2>
          <p>
            서비스 관련 문의는
            <a href="mailto:unifact.app@gmail.com">unifact.app@gmail.com</a>로
            보내주세요.
          </p>
        </section>
      </article>
    </main>
  </body>
</html>
